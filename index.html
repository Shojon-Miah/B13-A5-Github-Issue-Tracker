<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub-Issues-Tracker</title>

    <!-- daisyiu + tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- stylesheet -->
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body class="bg-gray-100 min-h-screen">
    <!-- Navbar section -->
    <nav class="bg-white shadow-sm px-6 py-4">

        <div class="max-w-7xl max-auto flex items-center justify-between">
            <!-- logo and title -->
            <div class="flex items-center gap-2">

                <img src="./assets/github-logo.png" alt="github logo" class="w-8 h-8">

                <h2 class="text-lg font-semibold">
                    GitHub Issues Tracker
                </h2>

            </div>

            <!-- Search button -->
            <div class="flex items-center gap-2">
                <input id="search-input" type="text" placeholder="Search issues...." class="input input-bordered w-64">

                <button id="search-button" class="btn btn-primary">
                    New Issue
                </button>

            </div>

        </div>

    </nav>
    
    <script src="./scripts/issues.js"></script>
    <script src="./scripts/search.js"></script>

</body>

</html>

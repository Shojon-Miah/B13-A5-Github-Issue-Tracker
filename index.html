<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub-Issues-Tracker</title>

    <!-- daisyiu + tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- stylesheet -->
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body class="bg-gray-100 min-h-screen">
    <!-- Navbar section -->
    <nav class="bg-white shadow-sm px-6 py-3">

        <div class="max-w-7xl max-auto flex items-center justify-between">
            <!-- logo and title -->
            <div class="flex items-center gap-2">

                <img src="./assets/github-logo.png" alt="github logo" class="w-8 h-8">

                <h2 class="text-lg font-semibold">
                    GitHub Issues Tracker
                </h2>

            </div>

            <!-- Search button -->
            <div class="flex items-center gap-2">
                <input id="search-input" type="text" placeholder="Search issues...." class="input input-bordered w-64">

                <button id="search-button" class="btn btn-primary flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i>

                    <!-- plus Icon -->

                    New Issue
                </button>

            </div>

        </div>

    </nav>

    <!-- Dashboard Card Container -->
    <section class="max-w-7xl mx-auto px-16 mt-8">

        <!-- Dashboard Card -->
        <div class="bg-white rounded-xl shadow-sm border-gray-200 border p-6">
            <!-- tabs -->
            <div class="flex items-center gap-4 mb-6">

                <button id="tab-all" class="btn btn-sm btn-primary">
                    All
                </button>

                <button id="tab-open" class="btn btn-sm text-gray-500 border-gray-200 btn-outline">
                    Open
                </button>

                <button id="tab-closed" class="btn btn-sm border-gray-200 text-gray-500   btn-outline">
                    Closed
                </button>

            </div>

            <!-- Issues info -->
            <div class="border rounded-xl px-1 py-4 flex items-center border-gray-200 justify-between mb-6">

                <div class="flex items-center gap-2">

                    <img src="./assets/Aperture.png" 
                        alt="Issue Icon" class="w-6 h-6">

                    <div>
                        <p class="text-sm font-medium">
                            <span id="issue-count">0</span> Issues
                        </p>

                        <p class="text-xs text-gray-500">
                            Track and manage your project issues
                        </p>

                    </div>

                </div>

                <div class="flex items-center gap-4 text-sm">

                    <div class="flex items-center font-semibold gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full"></span> Open
                    </div>

                    <div class="flex items-center font-semibold gap-1">
                        <span class="w-2 h-2 bg-purple-500 rounded-full"></span> Closed
                    </div>

                </div>

            </div>

            <!-- Dynamic Issues Card Render-->

            <div id="issues-container" 
                 class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">


             </div>

        </div>


    </section>

    <script src="./scripts/issues.js"></script>
    <script src="./scripts/search.js"></script>

</body>

</html>
